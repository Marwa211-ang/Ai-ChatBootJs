<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ChatBot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
</head>
<body>
  <section class="hero-container">
    <div class="hero-text">
      <h1>your personal AI Assistant</h1>
      <p>Hi! I'm an AI-powered chatbot, ready to assist you anytime with high precision.</p>    </div>

  </section>
  <button class="chat-toggler">
    <span class="material-symbols-rounded">chat</span>
  </button>

  <div class="chatbot">
   <header>
      <h2>ChatBot</h2>
      
      <div class="header-btns" style="display: flex; gap: 15px; align-items: center; flex-direction: row-reverse;">
        <span class="close-btn material-symbols-outlined" style="cursor: pointer; font-size: 1.6rem;">close</span>
        
        <span id="fullscreen-btn" class="material-symbols-outlined" style="cursor: pointer; font-size: 1.6rem;">fullscreen</span>        
        <span id="clear-btn" class="material-symbols-outlined" style="cursor: pointer; font-size: 1.6rem;" title="مسح المحادثة">delete</span>
      </div>  
    </header>
    
    <ul class="chatbox">
      <li class="chat incoming">
        <span class="material-symbols-outlined">smart_toy</span>
        <p class="bot-msg">Hello ! How can I help you today? ✨</p>      </li>
    </ul>
    
    <div class="chat-input">
      <label for="file-input" id="upload-btn" class="material-symbols-outlined">attach_file</label>
<input type="file" id="file-input" accept=".jpg, .jpeg, .png, .txt, .js, .html, .css" hidden>      
      <textarea placeholder="Type your message here..." spellcheck="false" required></textarea>
      
      <span id="send-btn" class="material-symbols-outlined">send</span>
    </div>
  </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>


  <script src="js/script.js" defer></script>
  <script src="js/config.js" defer></script>

</body>
</html>
